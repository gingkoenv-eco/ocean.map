<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Scotland Ocean Conservation Organisations</title>
    
    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 1;
            touch-action: none;
        }

        #pattern-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .mapboxgl-popup-content {
            padding: 16px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 320px;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            color: #1f4e79;
            margin-bottom: 8px;
            border-bottom: 2px solid #1f4e79;
            padding-bottom: 6px;
        }

        .popup-section {
            margin: 8px 0;
            font-size: 13px;
        }

        .popup-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }

        .popup-value {
            color: #555;
            line-height: 1.4;
        }

        .popup-link {
            color: #1f4e79;
            text-decoration: none;
            font-weight: 500;
            word-break: break-word;
        }

        .popup-link:hover {
            text-decoration: underline;
        }

        .info-banner {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: white;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
            font-size: 14px;
            color: #333;
            pointer-events: auto;
        }

        .info-banner button {
            margin-top: 8px;
            padding: 6px 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .info-banner button:hover {
            background-color: #163a5f;
        }

        .mapboxgl-popup-tip {
            border-top-color: white;
        }

        /* Side Panel Styles */
        #side-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 400px;
            max-width: 100vw;
            height: 100vh;
            background-color: white;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            z-index: 150;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        #side-panel.open {
            transform: translateX(0);
        }

        @media (max-width: 480px) {
            #side-panel {
                left: 0;
                right: 0;
                top: auto;
                bottom: 0;
                width: 100%;
                height: auto;
                max-height: 78vh;
                border-radius: 16px 16px 0 0;
                transform: translateY(100%);
                padding: 16px;
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }

            #side-panel.open {
                transform: translateY(0);
            }

            /* Collapsible search bar: icon-only by default, expands on tap */
            #city-search-container {
                top: 12px;
                right: 12px;
                width: 44px;
                transition: width 0.25s ease-in-out;
            }

            #city-search-container.expanded {
                width: calc(100vw - 24px);
            }

            #city-search-bar {
                padding: 5px;
            }

            #city-search {
                width: 0;
                padding: 0;
                opacity: 0;
                transition: opacity 0.2s ease-in-out;
            }

            #city-search-container.expanded #city-search {
                width: auto;
                flex: 1;
                padding: 10px 4px;
                opacity: 1;
            }

            /* Simplified info banner: no card/background, just a small button */
            .info-banner {
                top: 12px;
                left: 12px;
                background-color: transparent;
                box-shadow: none;
                padding: 0;
            }

            .info-banner strong,
            .info-banner small,
            .info-banner br {
                display: none;
            }

            .info-banner button {
                margin-top: 0;
                padding: 8px 12px;
                font-size: 11px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            }

            /* Legend collapses behind a toggle chip */
            #legend {
                bottom: 12px;
                right: 12px;
                padding: 0;
                max-height: 36px;
                overflow: hidden;
                transition: max-height 0.25s ease-in-out, padding 0.25s ease-in-out;
                width: 130px;
            }

            #legend.expanded {
                max-height: 300px;
                padding: 12px;
            }

            .legend-title {
                cursor: pointer;
                padding: 9px 12px;
                margin-bottom: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            #legend.expanded .legend-title {
                padding: 0;
                margin-bottom: 10px;
            }

            .legend-items-wrap {
                display: none;
            }

            #legend.expanded .legend-items-wrap {
                display: block;
            }

            #legend-chevron {
                display: inline;
                transition: transform 0.2s ease-in-out;
            }

            #legend.expanded #legend-chevron {
                transform: rotate(180deg);
            }

            /* Zoom controls tucked closer since legend shrinks */
            #zoom-controls {
                right: 12px;
                bottom: 60px;
            }

            /* Filter controls collapse behind a toggle on mobile */
            .filter-toggle-btn {
                display: inline-block;
            }

            .filter-controls {
                display: none;
                width: 100%;
                flex-direction: column;
                margin-top: 10px;
            }

            .filter-controls.open {
                display: flex;
            }

            .filter-select {
                width: 100%;
            }
        }

        #side-panel-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
            padding: 0;
            width: 30px;
            height: 30px;
            z-index: 1;
        }

        #side-panel-close:hover {
            color: #1f4e79;
        }

        .panel-title {
            font-size: 24px;
            font-weight: bold;
            color: #1f4e79;
            margin-bottom: 10px;
            margin-top: 20px;
            padding-bottom: 10px;
            padding-right: 40px;
            border-bottom: 3px solid #1f4e79;
        }

        .panel-section {
            margin: 16px 0;
        }

        .panel-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .panel-value {
            color: #555;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .panel-title {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .volunteering-box {
            background-color: #f0f7ff;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #1f4e79;
            margin: 12px 0;
        }

        .volunteering-box .panel-label {
            color: #1f4e79;
        }

        .panel-link {
            display: inline-block;
            margin-top: 8px;
            color: #1f4e79;
            text-decoration: none;
            font-weight: 500;
            word-break: break-word;
            background-color: #f0f7ff;
            padding: 10px 14px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .panel-link:hover {
            background-color: #e6eff7;
        }

        /* Legend Styles */
        #legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: white;
            padding: 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .legend-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
        }

        .legend-label {
            color: #555;
            text-transform: capitalize;
        }

        #legend-chevron {
            display: none;
            color: #999;
            font-size: 12px;
        }

        /* Organisation Type Badge */
        .org-type-badge {
            display: inline-block;
            margin: 0 0 6px 0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: capitalize;
            width: fit-content;
        }

        .org-type-conservation {
            background-color: #e6f0f7;
            color: #1f4e79;
            border: 1px solid #a6d0e8;
        }

        .org-type-research {
            background-color: #e8f8f0;
            color: #1e7e34;
            border: 1px solid #a8e6c1;
        }

        .org-type-marine-wildlife {
            background-color: #e0f5f3;
            color: #0f766e;
            border: 1px solid #a0d9d1;
        }

        .org-type-cleanups {
            background-color: #e0f4fa;
            color: #0e7490;
            border: 1px solid #9fd4e8;
        }

        .org-type-campaigning {
            background-color: #f2e8fc;
            color: #7c3aed;
            border: 1px solid #cba6f0;
        }

        .org-type-education {
            background-color: #fdf0e0;
            color: #c2620a;
            border: 1px solid #f0c78a;
        }

        .org-type-climate {
            background-color: #f5e9df;
            color: #92400e;
            border: 1px solid #d9b28a;
        }

        .org-type-others {
            background-color: #ffe8e8;
            color: #c41c1c;
            border: 1px solid #f5a8a8;
        }

        /* Search Bar Styles */
        #city-search-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 101;
            width: 320px;
        }

        #city-search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #search-logo {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            background-color: #1f4e79;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
            border: none;
            padding: 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        #search-logo span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #city-search {
            flex: 1;
            border: none;
            padding: 10px 0;
            font-size: 14px;
            background-color: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #city-search:focus {
            outline: none;
            box-shadow: none;
        }

        #city-search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background-color: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: none;
            margin-top: -6px;
            padding-top: 6px;
            z-index: 102;
        }

        #city-search-dropdown.active {
            display: block;
        }

        .city-dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            color: #333;
            transition: background-color 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .city-dropdown-item:hover {
            background-color: #f0f7ff;
            color: #1f4e79;
        }

        .city-dropdown-item.selected {
            background-color: #e6eff7;
            color: #1f4e79;
            font-weight: 600;
        }

        .city-dropdown-header {
            padding: 8px 16px;
            font-size: 12px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            background-color: #fafafa;
        }

        /* Zoom Controls */
        #zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 280px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zoom-button {
            width: 40px;
            height: 40px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            color: #1f4e79;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-button:hover {
            background-color: #f0f7ff;
            border-color: #1f4e79;
            box-shadow: 0 4px 12px rgba(31, 78, 121, 0.2);
        }

        .zoom-button:active {
            transform: scale(0.95);
        }

        /* View Toggle Button */
        #view-toggle {
            position: fixed;
            top: 130px;
            left: 20px;
            background-color: white;
            padding: 10px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
            font-size: 14px;
            color: #333;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        #view-toggle:hover {
            background-color: #f0f7ff;
            color: #1f4e79;
        }

        #view-toggle:disabled {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        /* Map View Button in Table */
        #table-view-back-btn {
            background-color: #1f4e79;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        #table-view-back-btn:hover {
            background-color: #153a52;
        }

        /* Table View Container */
        #table-view-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 200;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        #table-view-container.active {
            display: flex;
        }

        /* Table Header with Controls */
        #table-header {
            background-color: #fafbfc;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 20px;
            flex-shrink: 0;
        }

        .table-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-title {
            font-size: 17px;
            font-weight: 700;
            color: #1f2937;
            letter-spacing: -0.01em;
        }

        .table-controls-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #6b7280;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .table-controls-close:hover {
            background-color: #f0f0f0;
            color: #1f2937;
        }

        .table-search-filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-toggle-btn {
            display: none;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: white;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            color: #374151;
        }

        .filter-toggle-btn:hover {
            border-color: #1f4e79;
            color: #1f4e79;
        }

        .filter-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .table-search-box {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            color: #1f2937;
        }

        .table-search-box:focus {
            outline: none;
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.1);
        }

        .filter-select {
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            background-color: white;
            cursor: pointer;
            font-family: inherit;
            color: #1f2937;
        }

        .filter-select:focus {
            outline: none;
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.1);
        }

        .table-results-info {
            font-size: 11px;
            color: #9ca3af;
            padding-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
        }

        /* Table Content */
        #table-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 20px 20px;
        }

        .table-row-card {
            background-color: white;
            border: none;
            border-bottom: 1px solid #eef0f2;
            border-radius: 0;
            padding: 11px 6px;
            margin-bottom: 0;
            transition: background-color 0.12s;
            cursor: pointer;
        }

        .table-row-card:hover {
            background-color: #f8fafc;
            box-shadow: none;
            border-color: #eef0f2;
        }

        .table-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 10px;
        }

        .table-row-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #1f2937;
            flex: 1;
            line-height: 1.3;
        }

        .table-row-type-badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 12px;
            font-size: 10.5px;
            font-weight: 600;
            text-transform: capitalize;
            white-space: nowrap;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .table-row-type-conservation {
            background-color: #e6f0f7;
            color: #1f4e79;
            border: 1px solid #a6d0e8;
        }

        .table-row-type-research {
            background-color: #e8f8f0;
            color: #1e7e34;
            border: 1px solid #a8e6c1;
        }

        .table-row-type-marine-wildlife {
            background-color: #e0f5f3;
            color: #0f766e;
            border: 1px solid #a0d9d1;
        }

        .table-row-type-cleanups {
            background-color: #e0f4fa;
            color: #0e7490;
            border: 1px solid #9fd4e8;
        }

        .table-row-type-campaigning {
            background-color: #f2e8fc;
            color: #7c3aed;
            border: 1px solid #cba6f0;
        }

        .table-row-type-education {
            background-color: #fdf0e0;
            color: #c2620a;
            border: 1px solid #f0c78a;
        }

        .table-row-type-climate {
            background-color: #f5e9df;
            color: #92400e;
            border: 1px solid #d9b28a;
        }

        .table-row-type-others {
            background-color: #ffe8e8;
            color: #c41c1c;
            border: 1px solid #f5a8a8;
        }

        .table-row-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 6px 16px;
            font-size: 12px;
        }

        .table-row-detail-item {
            display: flex;
            flex-direction: column;
        }

        .table-row-detail-label {
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 1px;
            text-transform: uppercase;
            font-size: 9.5px;
            letter-spacing: 0.05em;
        }

        .table-row-detail-value {
            color: #374151;
            line-height: 1.35;
            word-break: break-word;
            font-size: 12.5px;
        }

        .table-row-detail-value a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: 500;
        }

        .table-row-detail-value a:hover {
            text-decoration: underline;
        }

        .table-row-description {
            color: #6b7280;
            line-height: 1.45;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f3f4f6;
            font-style: normal;
            font-size: 12.5px;
        }

        .table-empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .table-empty-state-icon {
            font-size: 40px;
            margin-bottom: 14px;
            opacity: 0.6;
        }

        .table-empty-state-text {
            font-size: 14px;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Pattern canvas (grey background with crosses) -->
    <canvas id="pattern-canvas"></canvas>
    
    <!-- Map container -->
    <div id="map"></div>
    
    <!-- City / Organisation Search Bar -->
    <div id="city-search-container">
        <div id="city-search-bar">
            <button id="search-logo" aria-label="Search"><span>🌊</span></button>
            <input 
                type="text" 
                id="city-search" 
                placeholder="Search organisations or places..."
                autocomplete="off"
            >
        </div>
        <div id="city-search-dropdown"></div>
    </div>

    <!-- Information banner -->

    <!-- Mapbox GL JS JavaScript library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>

    <script>
        // ============================================================
        // PATTERN CANVAS - Grey background with crosses
        // ============================================================

        const canvas = document.getElementById('pattern-canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawPattern();
        }

        // Draw the pattern on grey background
        function drawPattern() {
            // Grey background
            ctx.fillStyle = '#d3d3d3'; // Light grey
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw repeated plus pattern
            const plusSize = 30; // Distance between plus signs
            const plusWidth = 2; // Line thickness
            const plusLength = 12; // Length of plus arms

            ctx.strokeStyle = '#a9a9a9'; // Darker grey for plus signs
            ctx.lineWidth = plusWidth;
            ctx.lineCap = 'round';

            // Draw plus signs across the entire canvas
            for (let x = 0; x < canvas.width; x += plusSize) {
                for (let y = 0; y < canvas.height; y += plusSize) {
                    drawPlus(x, y, plusLength);
                }
            }
        }

        // Draw a single plus sign at given coordinates
        function drawPlus(x, y, length) {
            const half = length / 2;

            // Horizontal line
            ctx.beginPath();
            ctx.moveTo(x - half, y);
            ctx.lineTo(x + half, y);
            ctx.stroke();

            // Vertical line
            ctx.beginPath();
            ctx.moveTo(x, y - half);
            ctx.lineTo(x, y + half);
            ctx.stroke();
        }

        // Resize canvas on window resize
        window.addEventListener('resize', resizeCanvas);

        // Initial canvas setup
        resizeCanvas();

        // ============================================================
        // MAPBOX GL JS - Scotland Ocean Conservation Map
        // ============================================================

        // ============================================================
        // SINGLE SOURCE OF TRUTH: the full dataset now lives in its own file,
        // organisations.json, sitting next to this HTML file in the repo. The
        // page fetches it at runtime instead of having it pasted into the HTML.
        // To update the map: just overwrite organisations.json and push - this
        // file never needs to be touched again.
        // ============================================================
        let GEOJSON_DATA = null;
        let EMBEDDED_ORGANISATIONS = [];

        // Set your Mapbox access token
        mapboxgl.accessToken = 'pk.eyJ1IjoiZ2lua29lY28iLCJhIjoiY21taXphZTU5MTQwMjJxczgzdTR0MWdjOCJ9.x2DI85dEn6YpKewHBdiF2A';

        // Initialize the map
        const map = new mapboxgl.Map({
            container: 'map', // Container ID from HTML
            style: 'mapbox://styles/ginkoeco/cmn1qjpov00b901r0c24a6ibv', // Custom Mapbox style
            center: [-4, 57], // Coordinates for Scotland [longitude, latitude]
            zoom: 5, // Zoom level
            pitch: 0, // No tilt
            bearing: 0 // No rotation
        });

        // ============================================================
        // ADD SOURCES AND LAYERS
        // ============================================================

        // Wait for the map to load before adding sources and layers
        let mapStyleReady = false;
        let orgDataReady = false;

        function tryInitializeApp() {
            if (!mapStyleReady || !orgDataReady) return;
            initializeApp();
        }

        map.on('load', function () {
            mapStyleReady = true;

            // Defensive cleanup: the custom Studio style (ginkoeco/cmn1qjpov00b901r0c24a6ibv)
            // was originally built around the old Mapbox tileset workflow, and may still
            // contain its own circle layer rendering that data with default (black,
            // unstyled) dots. Since we now render all organisation points ourselves via
            // JS (the clustering layers added below), hide any such leftover circle
            // layers here so they can't show through behind/around our clusters.
            // At this point in load, none of our own layers exist yet, so anything
            // circle-typed found here is necessarily a pre-existing style layer.
            map.getStyle().layers.forEach(function (layer) {
                if (layer.type === 'circle') {
                    console.warn('Hiding leftover circle layer baked into the Mapbox style:', layer.id, '- if this is unexpected, remove/hide it directly in Mapbox Studio instead.');
                    map.setLayoutProperty(layer.id, 'visibility', 'none');
                }
            });

            tryInitializeApp();
        });

        // Fetch the dataset at runtime instead of embedding it in this file.
        fetch('organisations.json')
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (data) {
                GEOJSON_DATA = data;
                EMBEDDED_ORGANISATIONS = GEOJSON_DATA.features.map(function (f) {
                    return Object.assign({}, f.properties, {
                        _lon: f.geometry.coordinates[0],
                        _lat: f.geometry.coordinates[1]
                    });
                });
                orgDataReady = true;
                document.getElementById('view-toggle').disabled = false;
                tryInitializeApp();
            })
            .catch(function (err) {
                console.error('Failed to load organisations.json:', err);
                document.getElementById('info-banner').innerHTML =
                    '<strong>⚠️ Couldn\'t load organisation data</strong><br><small>Please refresh the page</small>';
            });

        function initializeApp() {
            console.log('Map loaded successfully');

            // ============================================================
            // SEARCH FUNCTIONALITY (organisations + places)
            // ============================================================

            // Cities are known instantly from the embedded dataset - no need to
            // wait for map tiles to load.
            const allCities = Array.from(new Set(
                EMBEDDED_ORGANISATIONS.map(org => org.City).filter(Boolean)
            )).sort();

            // Debounce helper so we don't hammer the geocoding API on every keystroke
            function debounce(fn, delay) {
                let timer = null;
                return function (...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            // Search organisations by name/city (instant, local)
            function searchOrganisations(searchText) {
                const q = searchText.toLowerCase();
                return EMBEDDED_ORGANISATIONS.filter(org =>
                    (org.Name && org.Name.toLowerCase().includes(q)) ||
                    (org.City && org.City.toLowerCase().includes(q))
                ).slice(0, 6);
            }

            // Function to search cities/places using Mapbox Geocoding API, and
            // combine with local organisation-name matches.
            async function searchCities(searchText) {
                const dropdown = document.getElementById('city-search-dropdown');

                if (!searchText.trim()) {
                    dropdown.classList.remove('active');
                    return;
                }

                const orgMatches = searchOrganisations(searchText);
                let dropdownHTML = '';

                if (orgMatches.length > 0) {
                    dropdownHTML += '<div class="city-dropdown-header">Organisations (' + orgMatches.length + ')</div>';
                    orgMatches.forEach(org => {
                        dropdownHTML += `<div class="city-dropdown-item" data-org="${encodeURIComponent(org.Name)}">
                            🏢 ${org.Name}${org.City ? ' <span style="color:#999;">— ' + org.City + '</span>' : ''}
                        </div>`;
                    });
                }

                dropdown.innerHTML = dropdownHTML || '<div class="city-dropdown-header">Searching places…</div>';
                dropdown.classList.add('active');

                // Wire up org result clicks immediately (don't wait on geocoding)
                document.querySelectorAll('.city-dropdown-item[data-org]').forEach(item => {
                    item.addEventListener('click', function () {
                        const orgName = decodeURIComponent(this.getAttribute('data-org'));
                        zoomToOrganisation(orgName);
                    });
                });

                try {
                    // Scotland bounding box: [west, south, east, north]
                    const bbox = '-7.5,54.4,-1.5,58.7';
                    const response = await fetch(
                        `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(searchText)}.json?types=place&bbox=${bbox}&limit=6&access_token=${mapboxgl.accessToken}`
                    );
                    const data = await response.json();

                    let placesHTML = '';
                    if (data.features && data.features.length > 0) {
                        placesHTML += '<div class="city-dropdown-header">Places (' + data.features.length + ')</div>';
                        data.features.forEach(feature => {
                            const placeName = feature.place_name;
                            const coords = feature.center;
                            placesHTML += `<div class="city-dropdown-item" data-coords="${coords[0]},${coords[1]}" data-place="${placeName}">
                                📍 ${placeName}
                            </div>`;
                        });
                    }

                    if (!orgMatches.length && !placesHTML) {
                        dropdown.innerHTML = '<div class="city-dropdown-item">No results found</div>';
                        return;
                    }

                    dropdown.innerHTML = (dropdownHTML || '') + placesHTML;

                    // Re-wire org clicks (innerHTML was replaced) + wire place clicks
                    document.querySelectorAll('.city-dropdown-item[data-org]').forEach(item => {
                        item.addEventListener('click', function () {
                            const orgName = decodeURIComponent(this.getAttribute('data-org'));
                            zoomToOrganisation(orgName);
                        });
                    });
                    document.querySelectorAll('.city-dropdown-item[data-coords]').forEach(item => {
                        item.addEventListener('click', function () {
                            const coords = this.getAttribute('data-coords').split(',').map(Number);
                            const placeName = this.getAttribute('data-place');
                            zoomToCity(coords, placeName);
                        });
                    });
                } catch (error) {
                    console.error('Geocoding error:', error);
                    if (!orgMatches.length) {
                        dropdown.innerHTML = '<div class="city-dropdown-item">Error searching places</div>';
                    }
                }
            }

            const debouncedSearchCities = debounce(searchCities, 250);

            // Function to zoom to a selected place
            function zoomToCity(coords, placeName) {
                const searchInput = document.getElementById('city-search');
                searchInput.value = placeName;
                document.getElementById('city-search-dropdown').classList.remove('active');

                map.flyTo({
                    center: coords,
                    zoom: 12,
                    duration: 2000
                });
                collapseSearchOnMobile();
            }

            // Function to zoom to a selected organisation and open its side panel
            function zoomToOrganisation(orgName) {
                const org = EMBEDDED_ORGANISATIONS.find(o => o.Name === orgName);
                if (!org) return;

                const searchInput = document.getElementById('city-search');
                searchInput.value = org.Name;
                document.getElementById('city-search-dropdown').classList.remove('active');

                if (org._lon != null && org._lat != null) {
                    map.flyTo({
                        center: [org._lon, org._lat],
                        zoom: 14,
                        duration: 1600,
                        essential: true
                    });
                }
                openSidePanel(org);
                collapseSearchOnMobile();
            }

            // Close dropdown when clicking outside
            document.addEventListener('click', function (e) {
                const container = document.getElementById('city-search-container');
                if (!container.contains(e.target)) {
                    document.getElementById('city-search-dropdown').classList.remove('active');
                    collapseSearchOnMobile();
                }
            });

            // Search input event listener (debounced - avoids hammering the API)
            document.getElementById('city-search').addEventListener('input', function (e) {
                debouncedSearchCities(e.target.value);
            });

            // Open dropdown on focus
            document.getElementById('city-search').addEventListener('focus', function () {
                if (this.value.trim()) {
                    searchCities(this.value);
                }
            });

            // Mobile: tapping the search icon expands the collapsed search bar
            function collapseSearchOnMobile() {
                if (window.innerWidth <= 480) {
                    document.getElementById('city-search-container').classList.remove('expanded');
                }
            }

            document.getElementById('search-logo').addEventListener('click', function (e) {
                if (window.innerWidth <= 480) {
                    const container = document.getElementById('city-search-container');
                    const nowExpanded = container.classList.toggle('expanded');
                    if (nowExpanded) {
                        e.stopPropagation();
                        setTimeout(() => document.getElementById('city-search').focus(), 250);
                    }
                }
            });

            // ============================================================
            // MAP SOURCE & LAYERS (clustered GeoJSON)
            // ============================================================

            // Using a clustered GeoJSON source (rather than the previous vector
            // tileset) means: (1) clustering works at all - Mapbox GL only
            // supports clustering on GeoJSON sources, and (2) the map, table, and
            // search all read from the exact same embedded dataset, so they can
            // never disagree with each other.
            map.addSource('organisations-source', {
                type: 'geojson',
                data: GEOJSON_DATA,
                cluster: true,
                clusterMaxZoom: 13,
                clusterRadius: 80,
                clusterMinPoints: 6
            });

            // Individual (unclustered) points, colored by Organisation Type / Type.
            // Added FIRST so the cluster layer (added below) renders on top of it -
            // this guarantees a cluster bubble always fully covers any points it
            // represents, with nothing visible "poking out" from behind it.
            map.addLayer({
                id: 'unclustered-point',
                type: 'circle',
                source: 'organisations-source',
                filter: ['!', ['has', 'point_count']],
                minzoom: 0,
                maxzoom: 22,
                paint: {
                    // Keep points visible at all zoom levels with controlled scaling
                    'circle-radius': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        0, 5,
                        6, 6,
                        10, 7,
                        14, 8,
                        18, 9,
                        22, 10
                    ],
                    // Many entries have multiple comma-separated Type values
                    // (e.g. "research, conservation" or "education, Marine wildlife").
                    // A pin can only show one color, so we check for each of the 7
                    // categories in a fixed priority order and use the first match.
                    'circle-color': [
                        'case',
                        ['in', 'conservation', ['downcase', ['coalesce', ['get', 'Type'], ['get', 'Organisation Type'], 'others']]], '#1f4e79', // conservation - deep ocean blue
                        ['in', 'marine wildlife', ['downcase', ['coalesce', ['get', 'Type'], ['get', 'Organisation Type'], 'others']]], '#14b8a6', // marine wildlife - teal
                        ['in', 'cleanups', ['downcase', ['coalesce', ['get', 'Type'], ['get', 'Organisation Type'], 'others']]], '#17a2b8', // cleanups - cyan
                        ['in', 'campaigning', ['downcase', ['coalesce', ['get', 'Type'], ['get', 'Organisation Type'], 'others']]], '#9b59b6', // campaigning - purple
                        ['in', 'education', ['downcase', ['coalesce', ['get', 'Type'], ['get', 'Organisation Type'], 'others']]], '#e67e22', // education - orange
                        ['in', 'climate', ['downcase', ['coalesce', ['get', 'Type'], ['get', 'Organisation Type'], 'others']]], '#a0522d', // climate - brown
                        ['in', 'research', ['downcase', ['coalesce', ['get', 'Type'], ['get', 'Organisation Type'], 'others']]], '#2ecc71', // research - green
                        '#e74c3c' // others / unrecognized - red
                    ],
                    'circle-opacity': 0.95,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff',
                    'circle-pitch-alignment': 'map',
                    'circle-pitch-scale': 'map'
                }
            });

            // Cluster circles, sized/colored by how many points they contain.
            // Fully opaque (circle-opacity: 1) and added after unclustered-point
            // so a cluster bubble always completely covers the points within it.
            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'organisations-source',
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': [
                        'step', ['get', 'point_count'],
                        '#4a8fc7', 5,
                        '#1f4e79', 10,
                        '#163a5f'
                    ],
                    'circle-radius': [
                        'step', ['get', 'point_count'],
                        16, 5,
                        20, 10,
                        26
                    ],
                    'circle-opacity': 1,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Cluster count labels (added last so they sit on top of the cluster circles)
            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'organisations-source',
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': ['get', 'point_count_abbreviated'],
                    'text-size': 13,
                    'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold']
                },
                paint: {
                    'text-color': '#ffffff'
                }
            });

            // Clicking a cluster zooms in until it splits apart
            map.on('click', 'clusters', function (e) {
                const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
                const clusterId = features[0].properties.cluster_id;
                map.getSource('organisations-source').getClusterExpansionZoom(clusterId, function (err, zoom) {
                    if (err) return;
                    map.easeTo({
                        center: features[0].geometry.coordinates,
                        zoom: zoom,
                        duration: 600
                    });
                });
            });

            // Change cursor to pointer when hovering over clusters or points
            map.on('mouseenter', 'clusters', function () {
                map.getCanvas().style.cursor = 'pointer';
            });
            map.on('mouseleave', 'clusters', function () {
                map.getCanvas().style.cursor = '';
            });
            map.on('mouseenter', 'unclustered-point', function () {
                map.getCanvas().style.cursor = 'pointer';
            });
            map.on('mouseleave', 'unclustered-point', function () {
                map.getCanvas().style.cursor = '';
            });

            // Individual point click - zoom in and open side panel
            map.on('click', 'unclustered-point', function (e) {
                const properties = e.features[0].properties;
                const coords = e.features[0].geometry.coordinates.slice();
                const currentZoom = map.getZoom();
                const targetZoom = Math.min(Math.max(currentZoom + 2, 12), 16);

                map.flyTo({
                    center: coords,
                    zoom: targetZoom,
                    duration: 1200,
                    essential: true
                });

                openSidePanel(properties);
            });

            // Close button functionality
            document.getElementById('side-panel-close').addEventListener('click', function () {
                document.getElementById('side-panel').classList.remove('open');
            });

            // Zoom controls
            document.getElementById('zoom-in-btn').addEventListener('click', function () {
                map.zoomIn();
            });

            document.getElementById('zoom-out-btn').addEventListener('click', function () {
                map.zoomOut();
            });

            // ============================================================
            // SIDE PANEL INTERACTION
            // ============================================================

            // Function to open side panel with organisation details
            function openSidePanel(properties) {
                let panelHTML = '';

                // Add organisation type badge first (above title)
                const typeValue = properties['Type'] || properties['Organisation Type'];
                if (typeValue) {
                    const badgeClass = 'org-type-badge ' + getPrimaryTypeClass(typeValue, 'org-type-');
                    panelHTML += `<div class="${badgeClass}">${typeValue}</div>`;
                }

                // Add title/name
                panelHTML += `<div class="panel-title">${properties.Name || 'Organisation'}</div>`;

                // Add description if available
                if (properties.Description) {
                    panelHTML += `
                        <div class="panel-section">
                            <div class="panel-value">${properties.Description}</div>
                        </div>
                    `;
                }

                // Add volunteering information (prominently displayed)
                if (properties.Volunteering) {
                    panelHTML += `
                        <div class="panel-section volunteering-box">
                            <div class="panel-label">🤝 Volunteering:</div>
                            <div class="panel-value">${properties.Volunteering}</div>
                        </div>
                    `;

                    // Add volunteering details if available
                    const volunteeringDetails = properties.Volunteering_details || properties.volunteering_details;
                    if (volunteeringDetails) {
                        panelHTML += `
                            <div class="panel-section">
                                <div class="panel-label">Volunteering Details:</div>
                                <div class="panel-value">${volunteeringDetails}</div>
                            </div>
                        `;
                    }
                }

                // Add city/location if available
                if (properties.City) {
                    panelHTML += `
                        <div class="panel-section">
                            <div class="panel-label">📍 Location:</div>
                            <div class="panel-value">${properties.City}</div>
                        </div>
                    `;
                }

                // Add email if available
                if (properties.Email) {
                    panelHTML += `
                        <div class="panel-section">
                            <div class="panel-label">📧 Email:</div>
                            <div class="panel-value"><a href="mailto:${properties.Email}" style="color: #1f4e79; text-decoration: none;">${properties.Email}</a></div>
                        </div>
                    `;
                }

                // Add phone if available
                if (properties.Phone) {
                    panelHTML += `
                        <div class="panel-section">
                            <div class="panel-label">📱 Phone:</div>
                            <div class="panel-value"><a href="tel:${properties.Phone}" style="color: #1f4e79; text-decoration: none;">${properties.Phone}</a></div>
                        </div>
                    `;
                }

                // Add website link if available
                if (properties.Website) {
                    // Ensure the URL has a protocol
                    let websiteUrl = properties.Website;
                    if (!websiteUrl.startsWith('http://') && !websiteUrl.startsWith('https://')) {
                        websiteUrl = 'https://' + websiteUrl;
                    }
                    
                    panelHTML += `
                        <div class="panel-section">
                            <a href="${websiteUrl}" target="_blank" rel="noopener noreferrer" class="panel-link">
                                🌐 Visit Website
                            </a>
                        </div>
                    `;
                }

                // Add suggestion section
                panelHTML += `
                    <div class="panel-section">
                        <div class="panel-label">💡 Know another place?</div>
                        <div class="panel-value">Help us grow this map by suggesting ocean conservation organisations in Scotland.</div>
                        <a href="https://tally.so/r/pbW4NZ" target="_blank" rel="noopener noreferrer" class="panel-link">
                            📝 Suggest a Place
                        </a>
                    </div>
                `;

                // Update panel content and open it
                document.getElementById('panel-content').innerHTML = panelHTML;
                document.getElementById('side-panel').classList.add('open');
            }

            console.log('Setup complete');
        }

        // ============================================================
        // ERROR HANDLING
        // ============================================================

        map.on('error', function (error) {
            console.error('Map error:', error);
        });

        // Defensive resize: mobile browsers change the visible viewport height
        // when their address bar shows/hides, and rotating the device changes
        // both dimensions. Keeping the WebGL canvas's internal resolution in
        // sync with its CSS box avoids stale/mismatched rendering.
        let resizeTimer = null;
        function scheduleMapResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                map.resize();
            }, 150);
        }
        window.addEventListener('resize', scheduleMapResize);
        window.addEventListener('orientationchange', scheduleMapResize);

        // ============================================================
        // TABLE VIEW FUNCTIONALITY
        // ============================================================
        let allOrganisations = [];
        let filteredOrganisations = [];
        const mapFilterState = {
            type: '',
            city: ''
        };

        function applyMapFilters() {
            // Clustered GeoJSON sources need setData() to re-filter, not setFilter() -
            // setFilter only hides individual points but clusters are pre-computed
            // over the whole dataset, so their counts would stay wrong.
            const filtered = GEOJSON_DATA.features.filter(function (feature) {
                const props = feature.properties;

                let matchesType = true;
                if (mapFilterState.type) {
                    matchesType = getPrimaryCategory(getTypeValue(props)) === mapFilterState.type;
                }

                let matchesCity = true;
                if (mapFilterState.city) {
                    matchesCity = props.City === mapFilterState.city;
                }

                return matchesType && matchesCity;
            });

            map.getSource('organisations-source').setData({
                type: 'FeatureCollection',
                features: filtered
            });
        }

        function syncTableFilterUI() {
            document.getElementById('filter-type').value = mapFilterState.type;
            document.getElementById('filter-city').value = mapFilterState.city;
        }

        function resetAllFilters() {
            document.getElementById('filter-type').value = '';
            document.getElementById('filter-city').value = '';
            mapFilterState.type = '';
            mapFilterState.city = '';
            filterOrganisations();
            applyMapFilters();
        }

        // Shared classifier: many entries have multiple comma-separated Type
        // values (e.g. "research, conservation, education"). A badge/dot can only
        // show one color, so we check for each of the 7 categories in a fixed
        // priority order and use the first match. This priority order must stay in
        // sync with the map's circle-color paint expression above.
        // `prefix` lets callers reuse this for either "table-row-type-" or "org-type-" class names.
        function getPrimaryTypeClass(type, prefix) {
            const typeLC = (type || '').toLowerCase();
            if (typeLC.includes('conservation')) return prefix + 'conservation';
            if (typeLC.includes('marine wildlife')) return prefix + 'marine-wildlife';
            if (typeLC.includes('cleanups')) return prefix + 'cleanups';
            if (typeLC.includes('campaigning')) return prefix + 'campaigning';
            if (typeLC.includes('education')) return prefix + 'education';
            if (typeLC.includes('climate')) return prefix + 'climate';
            if (typeLC.includes('research')) return prefix + 'research';
            return prefix + 'others';
        }

        // Function to get badge class based on type
        function getTypeBadgeClass(type) {
            return getPrimaryTypeClass(type, 'table-row-type-');
        }

        // Function to get the primary category a type string belongs to
        // (used for filtering by "conservation" / "research" / "others")
        function getPrimaryCategory(type) {
            return getPrimaryTypeClass(type, '');
        }

        // Function to get type value (prioritize 'Type' field) - full display text
        function getTypeValue(properties) {
            return properties['Type'] || properties['Organisation Type'] || 'Others';
        }

        // Function to load all organisations for the table.
        // Uses the embedded dataset (see EMBEDDED_ORGANISATIONS above) rather than
        // querying the map's currently loaded vector tiles. Querying the map was
        // unreliable because Mapbox only keeps tiles for the current viewport/zoom
        // in memory - e.g. after clicking a point (which flies the map to that
        // location at a high zoom), only nearby entries were loaded, so most other
        // organisations silently disappeared from the table.
        function loadAllOrganisations() {
            if (allOrganisations.length > 0) return; // Already loaded

            if (EMBEDDED_ORGANISATIONS.length > 0) {
                allOrganisations = EMBEDDED_ORGANISATIONS.slice();
                filteredOrganisations = allOrganisations.slice();
                populateCityFilter();
                renderTable();
                console.log('Loaded', allOrganisations.length, 'organisations from embedded dataset');
            } else {
                console.error('No embedded organisations data found');
                document.getElementById('table-content').innerHTML = `
                    <div class="table-empty-state">
                        <div class="table-empty-state-icon">⚠️</div>
                        <div class="table-empty-state-text">Unable to load data</div>
                        <div>Please try again or refresh the page</div>
                    </div>
                `;
            }
        }

        // Function to populate city filter
        function populateCityFilter() {
            const cities = new Set();
            allOrganisations.forEach(org => {
                if (org.City) cities.add(org.City);
            });

            const citiesArray = Array.from(cities).sort();
            const filterCity = document.getElementById('filter-city');
            const currentFilter = filterCity.value;

            citiesArray.forEach(city => {
                if (!filterCity.querySelector(`option[value="${city}"]`)) {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    filterCity.appendChild(option);
                }
            });

            filterCity.value = currentFilter;
        }

        // Function to filter and search organisations
        function filterOrganisations() {
            const searchText = document.getElementById('table-search').value.toLowerCase();
            const typeFilter = document.getElementById('filter-type').value.toLowerCase();
            const cityFilter = document.getElementById('filter-city').value;

            mapFilterState.type = typeFilter;
            mapFilterState.city = cityFilter;
            applyMapFilters();

            filteredOrganisations = allOrganisations.filter(org => {
                // Search filter
                const matchesSearch = !searchText || 
                    (org.Name && org.Name.toLowerCase().includes(searchText)) ||
                    (org.Email && org.Email.toLowerCase().includes(searchText)) ||
                    (org.Website && org.Website.toLowerCase().includes(searchText)) ||
                    (org.Description && org.Description.toLowerCase().includes(searchText));

                // Type filter (uses same priority classification as the map dots/badges)
                const matchesType = !typeFilter || getPrimaryCategory(getTypeValue(org)) === typeFilter;

                // City filter
                const matchesCity = !cityFilter || org.City === cityFilter;

                return matchesSearch && matchesType && matchesCity;
            });

            renderTable();
        }

        // Function to render the table
        function renderTable() {
            const tableContent = document.getElementById('table-content');
            const resultsCount = document.getElementById('table-results-count');

            resultsCount.textContent = filteredOrganisations.length;

            if (filteredOrganisations.length === 0) {
                tableContent.innerHTML = `
                    <div class="table-empty-state">
                        <div class="table-empty-state-icon">🔍</div>
                        <div class="table-empty-state-text">No organisations found</div>
                        <div>Try adjusting your filters or search terms</div>
                    </div>
                `;
                return;
            }

            tableContent.innerHTML = filteredOrganisations.map(org => {
                const type = getTypeValue(org);
                const typeBadgeClass = getTypeBadgeClass(type);
                
                let detailsHTML = '';

                if (org.City) {
                    detailsHTML += `
                        <div class="table-row-detail-item">
                            <div class="table-row-detail-label">📍 Location</div>
                            <div class="table-row-detail-value">${org.City}</div>
                        </div>
                    `;
                }

                if (org.Email) {
                    detailsHTML += `
                        <div class="table-row-detail-item">
                            <div class="table-row-detail-label">📧 Email</div>
                            <div class="table-row-detail-value"><a href="mailto:${org.Email}">${org.Email}</a></div>
                        </div>
                    `;
                }

                if (org.Phone) {
                    detailsHTML += `
                        <div class="table-row-detail-item">
                            <div class="table-row-detail-label">📱 Phone</div>
                            <div class="table-row-detail-value"><a href="tel:${org.Phone}">${org.Phone}</a></div>
                        </div>
                    `;
                }

                if (org.Website) {
                    let websiteUrl = org.Website;
                    if (!websiteUrl.startsWith('http://') && !websiteUrl.startsWith('https://')) {
                        websiteUrl = 'https://' + websiteUrl;
                    }
                    detailsHTML += `
                        <div class="table-row-detail-item">
                            <div class="table-row-detail-label">🌐 Website</div>
                            <div class="table-row-detail-value"><a href="${websiteUrl}" target="_blank" rel="noopener noreferrer">${org.Website}</a></div>
                        </div>
                    `;
                }

                if (org.Volunteering) {
                    detailsHTML += `
                        <div class="table-row-detail-item">
                            <div class="table-row-detail-label">🤝 Volunteering</div>
                            <div class="table-row-detail-value">${org.Volunteering}</div>
                        </div>
                    `;
                }

                let descriptionHTML = '';
                if (org.Description) {
                    descriptionHTML = `<div class="table-row-description">${org.Description}</div>`;
                }

                return `
                    <div class="table-row-card">
                        <div class="table-row-header">
                            <div class="table-row-name">${org.Name || 'Unnamed'}</div>
                            <span class="table-row-type-badge ${typeBadgeClass}">${type}</span>
                        </div>
                        <div class="table-row-details">
                            ${detailsHTML}
                        </div>
                        ${descriptionHTML}
                    </div>
                `;
            }).join('');
        }

        // Event listeners for table view
        // Function to switch to table view
        function switchToTableView() {
            document.getElementById('table-view-container').classList.add('active');
            document.getElementById('map').style.display = 'none';
            document.getElementById('pattern-canvas').style.display = 'none';
            document.getElementById('city-search-container').style.display = 'none';
            document.getElementById('zoom-controls').style.display = 'none';
            document.getElementById('legend').style.display = 'none';
            document.getElementById('info-banner').style.display = 'none';
            document.getElementById('view-toggle').style.display = 'none';

            // Load organisations if not already loaded
            if (allOrganisations.length === 0) {
                // Show loading state
                document.getElementById('table-content').innerHTML = `
                    <div class="table-empty-state">
                        <div class="table-empty-state-icon">⏳</div>
                        <div class="table-empty-state-text">Loading organisations...</div>
                    </div>
                `;
                setTimeout(loadAllOrganisations, 100);
            }
        }

        document.getElementById('view-toggle').addEventListener('click', switchToTableView);
        document.getElementById('table-view-back-btn').addEventListener('click', function() {
            document.getElementById('table-view-container').classList.remove('active');
            document.getElementById('map').style.display = 'block';
            document.getElementById('pattern-canvas').style.display = 'block';
            document.getElementById('city-search-container').style.display = 'block';
            document.getElementById('zoom-controls').style.display = 'flex';
            document.getElementById('legend').style.display = 'block';
            document.getElementById('info-banner').style.display = 'block';
            document.getElementById('view-toggle').style.display = 'block';
            // Trigger map resize to ensure it renders properly
            setTimeout(() => map.resize(), 100);
        });

        // Close button also returns to map view
        document.getElementById('table-view-close').addEventListener('click', function () {
            document.getElementById('table-view-back-btn').click();
        });

        document.getElementById('table-search').addEventListener('input', filterOrganisations);
        document.getElementById('filter-type').addEventListener('change', filterOrganisations);
        document.getElementById('filter-city').addEventListener('change', filterOrganisations);

        // Suggest a place button
        document.getElementById('suggest-place-btn').addEventListener('click', function() {
            window.open('https://tally.so/r/pbW4NZ', '_blank');
        });

        // ============================================================
        // MOBILE UI POLISH
        // ============================================================

        // Legend collapses to a small chip on mobile - tap to expand/collapse
        document.getElementById('legend-toggle').addEventListener('click', function () {
            if (window.innerWidth <= 480) {
                document.getElementById('legend').classList.toggle('expanded');
            }
        });

        // Filters collapse behind a toggle button on mobile
        document.getElementById('filter-toggle-btn').addEventListener('click', function () {
            document.getElementById('filter-controls').classList.toggle('open');
        });

        // Escape key closes the side panel or table view, whichever is open
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            const sidePanel = document.getElementById('side-panel');
            if (sidePanel.classList.contains('open')) {
                sidePanel.classList.remove('open');
                return;
            }
            if (document.getElementById('table-view-container').classList.contains('active')) {
                document.getElementById('table-view-back-btn').click();
            }
        });

        // Tapping the map (outside a point/cluster) closes an open side panel on mobile
        map.on('click', function (e) {
            if (window.innerWidth > 480) return;
            if (!map.getLayer('unclustered-point')) return; // layers not added yet
            const hits = map.queryRenderedFeatures(e.point, { layers: ['clusters', 'unclustered-point'] });
            if (hits.length === 0) {
                document.getElementById('side-panel').classList.remove('open');
            }
        });
    </script>
</body>
</html>

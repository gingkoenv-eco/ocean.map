name: Update map data from Google Sheet

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust the cron expression to change timing -
    # https://crontab.guru is handy for that.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab for on-demand runs

permissions:
  contents: write   # needed so the workflow can commit organisations.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Write service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Generate organisations.json
        run: python scripts/sync_sheet.py

      - name: Clean up credentials
        if: always()
        run: rm -f service_account.json

      - name: Commit and push if organisations.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add organisations.json
          git diff --staged --quiet || git commit -m "Auto-update organisations.json from Google Sheet"
          git push
